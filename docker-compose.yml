name: quickeats-compose

services:
  db:
    image: postgres:16-alpine
    container_name: quickeats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickeats
      POSTGRES_USER: quickeats
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickeats -d quickeats"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: quickeats-compose-backend:${IMAGE_TAG:-latest}
    container_name: quickeats-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://quickeats:${DB_PASSWORD}@db:5432/quickeats
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${APP_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: quickeats-compose-frontend:${IMAGE_TAG:-latest}
    container_name: quickeats-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
